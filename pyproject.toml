[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scholarly-retrieval-platform"
version = "0.1.0"
description = "Provenance-first scholarly search and citation graph aggregation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["scholarly-search", "citation-graph", "mcp", "research-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
mcp = ["mcp>=1.27,<2"]
ocr = ["ocrmypdf>=17,<18", "pillow>=11,<13"]
distributed = ["redis>=5,<7"]

[project.scripts]
scholar = "scholarly_retrieval.cli:app"
scholar-api = "scholarly_retrieval.api:main"
scholar-mcp = "scholarly_retrieval.mcp_server:main"
scholar-worker = "scholarly_retrieval.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarly_retrieval"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: opt-in tests that call real scholarly provider APIs",
  "ocr: opt-in tests that require OCRmyPDF, Tesseract, and GROBID",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
