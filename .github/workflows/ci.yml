name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --extra api --extra mcp --extra distributed
      - name: Lint
        run: uv run ruff check src tests tools
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Test
        run: uv run pytest -q
